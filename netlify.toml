# Prepared only. Do not connect GitHub/Netlify until the user approves launch.
[build]
  command = "pnpm build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

# Read-only official FPL endpoints. No credentials or mutation routes.
[[redirects]]
  from = "/api/fpl/entry/:entry/event/:event/picks"
  to = "https://fantasy.premierleague.com/api/entry/:entry/event/:event/picks/"
  status = 200
  force = true
[[redirects]]
  from = "/api/fpl/entry/:entry/history"
  to = "https://fantasy.premierleague.com/api/entry/:entry/history/"
  status = 200
  force = true
[[redirects]]
  from = "/api/fpl/entry/:entry"
  to = "https://fantasy.premierleague.com/api/entry/:entry/"
  status = 200
  force = true
[[redirects]]
  from = "/api/fpl/bootstrap"
  to = "https://fantasy.premierleague.com/api/bootstrap-static/"
  status = 200
  force = true
[[redirects]]
  from = "/api/fpl/fixtures"
  to = "https://fantasy.premierleague.com/api/fixtures/"
  status = 200
  force = true
[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404
  force = true
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/data/forecast-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Hash navigation works on static hosting without rewriting API failures into HTML.
